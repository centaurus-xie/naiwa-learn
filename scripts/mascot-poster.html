<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<title>奶蛙靜態首幀 · 本機工具</title>
<style>
  body { margin:32px; font-family:system-ui; background:#f7f7f2; color:#344d3e; }
  #model { position:relative; display:block; width:200px; height:260px; padding:0; border:0; background:none; }
  #model canvas { position:absolute; inset:0; width:100%; height:100%; }
  a { display:inline-block; padding:12px; }
</style>
<h1>奶蛙靜態首幀</h1>
<p>直接使用網站的模型、燈光、相機與初始姿態，輸出透明 PNG；不呼叫 API。</p>
<button id="model" disabled aria-label="奶蛙首幀預覽"></button>
<button id="reset" hidden>復位</button>
<p id="status">正在渲染…</p>
<a id="download" hidden download="naiwa-poster.png">下載同款靜態首幀</a>
<script type="module">
  import {mountNaiwa} from '../assets/mascot/scene.js?v=20261024-1';
  const button=document.getElementById('model'),status=document.getElementById('status');
  const ratio=Math.min(window.devicePixelRatio || 1,2);
  button.style.width=400/ratio+'px';button.style.height=520/ratio+'px';
  mountNaiwa({button,resetButton:document.getElementById('reset'),
    onReady(){
      // Snapshot synchronously after the first render, before WebGL clears its buffer.
      button.querySelector('canvas').toBlob(blob=>{
        if(!blob) {status.textContent='輸出失敗';return;}
        const link=document.getElementById('download');
        link.href=URL.createObjectURL(blob);link.hidden=false;status.textContent='首幀已準備好。';
      },'image/png');
    },
    onFallback(){status.textContent='無法建立 WebGL，未生成圖片。';}
  });
</script>
</html>
