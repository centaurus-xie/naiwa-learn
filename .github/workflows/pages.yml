name: Update cards and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *' # Hong Kong 08:17 (UTC+8)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify learning and feed logic
        run: |
          npm test
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Preserve checked-out fallback edition
        run: cp data/cards.json data/cards.seed.json
      - name: Restore last successful feed
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: data/cards.json
          key: cards-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cards-
      - name: Generate DeepSeek cards (repair up to 6 requests)
        id: refresh
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python3 scripts/update_cards.py
      - name: Report stale feed
        if: steps.refresh.outcome == 'failure'
        run: echo '::warning::News update failed. Deploying previously available cards; check the displayed update date.'
      - name: Cache current feed
        if: steps.refresh.outcome == 'success'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: data/cards.json
          key: cards-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Prepare public files
        run: |
          python3 -c 'from pathlib import Path; from scripts.update_cards import read_edition; assert read_edition(Path("data/cards.json")) is not None, "No valid cards to deploy"'
          mkdir -p _site
          cp index.html styles.css app.js learning.js _site/
          cp -R assets _site/
          mkdir -p _site/data
          cp data/cards.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Mark failed generation after publishing fallback
        if: steps.refresh.outcome == 'failure'
        env:
          FAILURE_REASON: ${{ steps.refresh.outputs.failure_reason || '生成步驟未回傳詳細原因，請查看 Generate DeepSeek cards 日誌。' }}
        run: |
          echo "::error::Card generation failed: $FAILURE_REASON Previous cards remain online."
          exit 1
