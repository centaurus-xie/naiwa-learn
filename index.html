<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7f2" />
    <meta name="description" content="奶蛙小課堂，每天五個 AI 新發現，和奶蛙一起看懂新技術、新應用與背後的意義。" />
    <title>奶蛙小課堂 · AI Daily</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" aria-label="奶蛙小課堂 首頁"><span class="brand-mark" aria-hidden="true">✳</span> 奶蛙小課堂<span class="brand-en">AI DAILY</span></a>
      <span class="daily-label"><i></i> 每天，一點新知</span>
    </header>
    <main>
      <section class="intro" aria-labelledby="headline">
        <span class="eyebrow" id="date-label">YOUR DAILY LITTLE DISCOVERY</span>
        <h1 id="headline">世界更新很快，<br>我們<span class="highlight">慢慢學。</span></h1>
        <p class="intro-copy">每天 5 張 AI 小卡。<br>留兩分鐘，給好奇的自己。</p>
        <div class="guide-scene">
          <div class="speech" id="guide-message" role="status">嗨！今天也一起學一點吧。<span aria-hidden="true">✦</span></div>
          <div class="mascot-window"><img src="./assets/guide.png" alt="你的學習夥伴奶蛙：綠眼睛、微笑的黃色生物" class="mascot" /></div>
          <span class="guide-caption">奶蛙 · 你的好奇心夥伴</span>
        </div>
      </section>
      <section class="learning" aria-label="每日學習卡片">
        <div class="session-heading"><span id="session-label">今天的小發現</span><span id="counter">01 <span>/ 05</span></span></div>
        <div class="progress" id="progress" aria-label="學習進度"></div>
        <article class="card" id="card" aria-live="polite">
          <div class="card-meta"><span class="pill" id="category">AI 基礎</span><span class="card-spark" aria-hidden="true">✳</span></div>
          <div class="card-content"><span class="card-kicker" id="kicker">值得關注的新進展</span><h2 id="question">正在準備今天的小發現…</h2><div id="answer" hidden><p id="answer-text"></p><div class="news-context" id="news-context" hidden><span>延伸閱讀 · 原文</span><p id="news-title"></p></div></div></div>
          <button class="reveal" id="reveal" disabled><span>看看這件事為什麼值得關注</span><span aria-hidden="true">↗</span></button>
          <a class="source" id="source" target="_blank" rel="noopener noreferrer" hidden>閱讀來源 <span aria-hidden="true">↗</span></a>
        </article>
        <div class="actions" id="actions" hidden><button class="again" id="again">↺ <span>稍後再看</span></button><button class="remember" id="remember"><span>下一個發現</span> <span aria-hidden="true">→</span></button></div>
        <p class="hint" id="hint">看看發生了什麼，再想想它意味著什麼。</p>
        <p class="feed-status" id="feed-status"></p>
        <p class="storage-notice" id="storage-notice" hidden>瀏覽器無法保存進度；這次仍可以正常學習。</p>
        <noscript>請啟用 JavaScript，即可翻卡學習。</noscript>
      </section>
    </main>
    <footer><span>一點一點，就會不一樣。</span><span>MADE FOR CURIOUS MINDS <span aria-hidden="true">✧</span></span></footer>
  </body>
</html>
